<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<style>
  :root { color-scheme: dark; --bg:#0a1022; --card:#101a36; --line:rgba(90,170,255,.22); --cyan:#35e0ff; --text:#dff1ff; --muted:#8fa8c8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:24px; margin:0 0 4px; }
  h2 { font-size:16px; margin:0 0 12px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  select, button { font:inherit; color:var(--text); background:#0c1530; border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  button { cursor:pointer; }
  button:hover, select:hover { border-color:var(--cyan); }
  .row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .row .n { width:20px; color:var(--muted); text-align:center; }
  .row select { flex:1; min-width:0; }
  .row svg, .pv svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .layout { display:grid; grid-template-columns:1fr 220px; gap:20px; align-items:start; }
  @media (max-width:620px) { .layout { grid-template-columns:1fr; } }
  .preview { position:relative; width:200px; height:200px; margin:0 auto; border-radius:50%; background:radial-gradient(circle,#060a16,#0c1a3a); border:1px solid var(--line); }
  .preview img { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; }
  .pv { position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line); background:#0c1530; }
  .corners { display:grid; grid-template-columns:repeat(2,64px); gap:8px; }
  .corners button.on { border-color:var(--cyan); box-shadow:0 0 0 1px rgba(53,224,255,.4); }
  .site { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
  .site:last-child { border-bottom:0; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .muted { color:var(--muted); }
  [dir=rtl] .row .n { text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Orbit</h1>
  <p class="sub" id="sub"></p>

  <section>
    <h2 id="hLang"></h2>
    <select id="lang"></select>
  </section>

  <section>
    <h2 id="hCorner"></h2>
    <div class="corners" id="corners"></div>
  </section>

  <section>
    <h2 id="hActions"></h2>
    <div class="layout">
      <div id="slots"></div>
      <div class="preview" id="preview"><img alt=""></div>
    </div>
    <div class="tools"><button id="reset"></button></div>
  </section>

  <section>
    <h2 id="hSites"></h2>
    <div id="sites"></div>
    <div class="tools">
      <button id="export"></button>
      <button id="import"></button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
  </section>
</main>
<script src="shared.js"></script>
<script src="logo.js"></script>
<script src="options.js"></script>
</body>
</html>
