<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">Orbit radial menu preview</title>
  <desc id="description">The Orbit radial menu is open in the lower-right corner of a sample webpage, showing eight browser actions.</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1">
      <stop stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#e9eff7"/>
    </linearGradient>
    <radialGradient id="ring">
      <stop stop-color="#101a36" stop-opacity=".98"/>
      <stop offset=".7" stop-color="#0b1530" stop-opacity=".96"/>
      <stop offset="1" stop-color="#0c1a3a" stop-opacity=".92"/>
    </radialGradient>
    <linearGradient id="button" x2="1" y2="1">
      <stop stop-color="#1b2c53"/>
      <stop offset="1" stop-color="#0a1024"/>
    </linearGradient>
    <filter id="shadow" x="-.5" y="-.5" width="2" height="2">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071020" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="960" height="600" rx="20" fill="url(#page)"/>
  <rect x="0" y="0" width="960" height="56" rx="20" fill="#fff"/>
  <rect x="0" y="36" width="960" height="20" fill="#fff"/>
  <circle cx="34" cy="28" r="10" fill="#35c9e6"/>
  <text x="55" y="34" fill="#17243a" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Orbit</text>
  <text x="876" y="33" fill="#718096" font-family="Segoe UI,Arial,sans-serif" font-size="13">sample page</text>
  <rect x="42" y="92" width="570" height="26" rx="7" fill="#cbd7e5"/>
  <rect x="42" y="137" width="760" height="12" rx="6" fill="#d5dee9"/>
  <rect x="42" y="161" width="710" height="12" rx="6" fill="#d5dee9"/>
  <rect x="42" y="185" width="740" height="12" rx="6" fill="#d5dee9"/>
  <rect x="42" y="227" width="410" height="190" rx="14" fill="#dce6f1"/>
  <rect x="475" y="227" width="410" height="190" rx="14" fill="#dce6f1"/>
  <rect x="42" y="444" width="775" height="12" rx="6" fill="#d5dee9"/>
  <rect x="42" y="468" width="680" height="12" rx="6" fill="#d5dee9"/>
  <g filter="url(#shadow)">
    <circle cx="776" cy="398" r="157" fill="url(#ring)" stroke="#50aaff" stroke-opacity=".4"/>
    <circle cx="776" cy="398" r="111" fill="none" stroke="#5aaaff" stroke-opacity=".16"/>
  </g>
  <g fill="url(#button)" stroke="#5aaaff" stroke-opacity=".42">
    <circle cx="776" cy="258" r="23"/><circle cx="875" cy="299" r="23"/>
    <circle cx="916" cy="398" r="23"/><circle cx="875" cy="497" r="23"/>
    <circle cx="776" cy="538" r="23"/><circle cx="677" cy="497" r="23"/>
    <circle cx="636" cy="398" r="23"/><circle cx="677" cy="299" r="23"/>
  </g>
  <g fill="none" stroke="#dff1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="769" y="250" width="14" height="16" rx="2"/><path d="M776 254v8m-4-4h8"/>
    <path d="M870 293h11v12h-11zM874 290h11v12"/>
    <path d="M916 390v14m-7-7h14"/>
    <circle cx="875" cy="497" r="9"/><path d="M875 491v6l4 2"/>
    <path d="M769 533h14v10h-14zM773 530h6"/>
    <path d="M670 493h14v10h-14zM674 490h6"/>
    <path d="M630 398h12m-6-6v12"/>
    <path d="M671 294h12v10h-12zM674 291h6"/>
  </g>
  <g fill="#dff1ff" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">
    <text x="776" y="224">New window</text><text x="875" y="266">New tab</text>
    <text x="916" y="365">Private</text><text x="875" y="465">History</text>
    <text x="776" y="580">Extensions</text><text x="677" y="465">Passwords</text>
    <text x="636" y="365">Settings</text><text x="677" y="266">Downloads</text>
  </g>
  <circle cx="776" cy="398" r="39" fill="#0a1022" stroke="#35e0ff" stroke-opacity=".65"/>
  <image href="../../icons/icon-48.png" x="751" y="373" width="50" height="50"/>
</svg>
